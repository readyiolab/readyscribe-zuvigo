<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>ReadyScribe Capture Options</title>
    <style>
      :root {
        color-scheme: light;
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        width: 380px;
        max-height: 600px;
        overflow: hidden;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Inter", system-ui, sans-serif;
        background: #f8fafc;
        color: #0f172a;
        -webkit-font-smoothing: antialiased;
      }
      body {
        padding: 14px;
        display: flex;
        flex-direction: column;
        height: 560px;
        max-height: 600px;
      }
      #root {
        flex: 1;
        min-height: 0;
        display: flex;
        flex-direction: column;
      }
      #root .co-panel { flex: 1; min-height: 0; }
      #root .co-list { max-height: none; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="popup.js"></script>
  </body>
</html>
