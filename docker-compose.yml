services:
  mysql:
    image: mysql:8.4
    container_name: zuvigo-mysql
    restart: unless-stopped
    ports:
      # Host 3307 avoids conflict with a local MySQL already on 3306
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: zuvigo
      MYSQL_USER: zuvigo
      MYSQL_PASSWORD: zuvigo
    volumes:
      - zuvigo_mysql_data:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: zuvigo-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - zuvigo_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  zuvigo_mysql_data:
  zuvigo_redis_data:
